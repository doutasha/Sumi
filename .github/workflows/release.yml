# Release do Sumi (Fase 5): publica draft no GitHub com instaladores +
# artefatos do updater assinados. Disparo: push de tag `v*` (ex.: v1.1.0).
# O updater dos usuários só enxerga a Release depois de publicada
# (draft -> revisar -> Publish). Segredo necessário:
# TAURI_SIGNING_PRIVATE_KEY (conteúdo do sumi.key, Settings > Secrets).
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # src-tauri mora em desktop/ (não na raiz): sem isso a action
          # não acha o projeto.
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Sumi ${{ github.ref_name }}'
          releaseDraft: true
          includeUpdaterJson: true
